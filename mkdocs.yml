# Situs dokumentasi Zul.
#
#   uv run mkdocs serve      # pratinjau di http://127.0.0.1:8001
#   uv run mkdocs build      # hasil statis di folder site/
#
# Susunan menu mengikuti Diátaxis (https://diataxis.fr): Tutorial untuk
# belajar, Panduan untuk mengerjakan tugas, Referensi untuk mencari fakta,
# dan Konsep untuk memahami alasannya. Satu halaman hanya berisi satu jenis.
site_name: Zul
# Alamat situs setelah diterbitkan ke GitHub Pages oleh
# .github/workflows/docs.yml. Domain zulkit.my.id dipasang di Settings >
# Pages repository; alamat lama kazuma313.github.io/zul_utilities/
# dialihkan GitHub ke domain ini.
site_url: https://zulkit.my.id/
site_description: CLI generator proyek AI berarsitektur hexagonal dan toolkit utilities untuk Python.
site_author: Kurnia Zulda Matondang
repo_url: https://github.com/kazuma313/zul_utilities
repo_name: kazuma313/zul_utilities
edit_uri: edit/main/docs/
docs_dir: docs
copyright: Dirilis di bawah lisensi MIT.

# Port 8000 dipakai API proyek hasil generate (uvicorn). Situs dokumentasi
# memakai 8001 supaya keduanya bisa jalan bersamaan dan playground di
# halaman dokumentasi bisa memanggil API itu.
dev_addr: 127.0.0.1:8001

# Catatan lama di docs/ yang bukan bagian dari situs dokumentasi, dan
# template tulisan blog (dipakai scripts/new_post.py, bukan halaman).
exclude_docs: |
  /commands.md
  /hexagonal_base.md
  /Tutorial Membuat Boilerplate Proyek CLI dengan Python.md
  /*.pdf
  /blog/_template.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  # Template yang menimpa bawaan Material. Saat ini hanya header, supaya
  # versi Zul tampil di samping nama situs.
  custom_dir: overrides
  language: id
  logo: assets/logo.jpg
  favicon: assets/logo.jpg
  # Font dimuat lewat extra_css di bawah (IBM Plex Sans dan IBM Plex Mono),
  # karena tema hanya memuat tebal 300, 400, dan 700.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mode gelap
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mode terang
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

extra_css:
  - https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap
  - assets/stylesheets/extra.css
  - assets/stylesheets/playground.css

extra_javascript:
  - assets/javascripts/playground.js

# Hook ini membaca versi Zul dari pyproject.toml untuk header situs.
hooks:
  - scripts/docs_hooks.py

# Daftar plugin menggantikan bawaan, jadi search harus ditulis ulang.
# Blog membaca tulisan di docs/blog/posts/. Setiap tulisan wajib punya
# date.created dan paragraf ringkasan di atas <!-- more -->; tanpa itu
# build gagal. Cara menulis tulisan: docs/panduan/menulis-blog.md.
plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_url_format: "{date}/{slug}"
      post_excerpt: required
      post_readtime: true
      archive_date_format: MMMM yyyy
      archive_url_date_format: yyyy/MM
      pagination_per_page: 10

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - github-callouts
  - toc:
      permalink: "#"
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
