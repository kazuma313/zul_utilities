          - Redis: panduan/memakai-redis.md
          - OCR: panduan/membaca-dokumen-ocr.md
          - LLM dan embedding: panduan/memanggil-llm-dan-embedding.md
          - Markdown ke PDF dan PPTX: panduan/mengonversi-markdown.md
          - Grafik perbandingan: panduan/membuat-grafik.md
          - Helper kecil: panduan/memakai-helper.md
          - Mengambil transcript YouTube: panduan/mengambil-transcript-youtube.md
