[project]
name = "folder-migrator"
version = "1.0.0"
description = "Resumable, production-grade utility for moving huge folder trees."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
folder-migrator = "main:main"

[tool.pytest.ini_options]
# Make the local package importable without an install step.
pythonpath = ["."]
testpaths = ["tests"]
