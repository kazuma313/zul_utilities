[project]
name = "cctv-analytics"
version = "0.1.0"
description = "Analitik video CCTV di atas Zul: zona, garis, lama kunjungan, perhatian, dan kontak."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "zul[detection] @ git+https://github.com/kazuma313/zul_utilities.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cctv = "cctv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Dependency dari URL git perlu izin eksplisit di hatchling.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cctv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cctv"]
