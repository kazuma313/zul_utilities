# Membangun situs dokumentasi dan menerbitkannya ke GitHub Pages.
#
# Sebelum dipakai pertama kali, buka Settings > Pages di repository dan
# pilih "GitHub Actions" sebagai Source. Setelah itu, setiap push ke main
# yang mengubah dokumentasi memicu workflow ini.
name: Dokumentasi

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu penerbitan yang berjalan; push yang lebih baru menggantikannya.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Pasang dependency dokumentasi
        run: pip install -r requirements-docs.txt

      # --strict menggagalkan build jika ada tautan atau anchor yang rusak.
      - name: Bangun situs
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
