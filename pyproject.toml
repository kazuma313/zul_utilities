[project]
name = "zul"
version = "0.1.1"
description = "CLI tool untuk membuat template proyek dan utilities"
readme = "README.md"
authors = [
    { name = "kazuma313", email = "koerzoelmatondang@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "inquirerpy>=0.3.4",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer[all]>=0.12.0",
]

[project.scripts]
zul = "zul.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
