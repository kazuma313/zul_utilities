[project]
name = "zul"
version = "0.1.0"
description = "Python toolkit for AI apps: RAG evaluation, a computer-vision boilerplate, library adapters, and an MCP server for code assistants"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "kazuma313", email = "koerzoelmatondang@gmail.com" }
]
requires-python = ">=3.11"
# Dependency utama hanya untuk perintah zul, config vector database, dan
# helper kecil seperti FakeEmbeddingModel. Library yang besar, seperti
# Docling yang ikut membawa torch, di-install lewat extra di bawah.
#
# tests/test_dependencies.py memastikan modul inti tetap bisa diimpor
# tanpa extra, dan setiap extra cukup untuk modul yang memakainya.
dependencies = [
    "inquirerpy>=0.3.4",
    "numpy>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
]

# Setiap utilitas punya dependency sendiri. Install hanya yang dipakai:
#   pip install "zul[milvus,redis] @ git+https://github.com/kazuma313/zul_utilities.git"
[project.optional-dependencies]
milvus = ["pymilvus>=2.5.0"]
redis = ["redis>=6.4.0", "redisvl>=0.10.0"]
converter = ["markdown>=3.5", "xhtml2pdf>=0.2.17", "python-pptx>=1.0.2"]
analysis = ["matplotlib>=3.9", "pandas>=2.0", "scipy>=1.16.2"]
pdf = ["pypdf>=4.0", "langchain-text-splitters>=0.3.0"]
ocr = ["docling>=2.74.0"]
llm = ["langchain-openai>=1.0.2", "langgraph>=1.0.2"]
gemini = ["google-genai>=1.0.0"]
# Computer vision: aturan perilaku cukup dengan numpy (dependency utama),
# vision untuk menggambar dan membaca video, tracking untuk ByteTrack,
# detection untuk model RF-DETR. Tidak ada library berlisensi AGPL.
vision = ["opencv-python>=4.10"]
tracking = ["lap>=0.5.12"]
detection = ["zul[vision,tracking]", "rfdetr>=1.11.2,<1.12"]
# MCP server: kode dan dokumentasi Zul dibaca code assistant lewat MCP.
mcp = ["mcp>=2.3,<3"]
# Evaluasi retrieval dan RAG dengan ragas. ragas 0.4.x dikunci karena adapternya
# menambal satu impor ragas yang rusak di langchain-community 0.4.
evaluation = [
    "ragas>=0.4.3,<0.5",
    "openpyxl>=3.1",
    "rapidfuzz>=3.0",
    "tqdm>=4.66",
]
all = [
    "zul[milvus,redis,converter,analysis,pdf,ocr,llm,gemini,vision,tracking,detection,mcp,evaluation]",
]

[project.scripts]
zul = "zul.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Dokumentasi Markdown dan boilerplate proyek ikut masuk wheel sebagai
# zul/_docs dan zul/_project, supaya MCP server Zul tetap bisa membacanya
# saat Zul di-install dari pip. Boilerplate disebut per file dan folder,
# karena force-include tidak membaca .gitignore: video, bobot, keluaran,
# dan .env di checkout lokal tidak boleh ikut masuk wheel.
# Kode framework ada di framework/; repository ini juga berisi dokumentasi
# dan research/, yang tidak ikut masuk package.
[tool.hatch.build.targets.wheel]
packages = ["framework/src/zul"]

[tool.hatch.build.targets.wheel.force-include]
"docs/tutorial" = "zul/_docs/tutorial"
"docs/panduan" = "zul/_docs/panduan"
"docs/referensi" = "zul/_docs/referensi"
"docs/konsep" = "zul/_docs/konsep"
"framework/project/README.md" = "zul/_project/README.md"
"framework/project/computer_vision/README.md" = "zul/_project/computer_vision/README.md"
"framework/project/computer_vision/pyproject.toml" = "zul/_project/computer_vision/pyproject.toml"
"framework/project/computer_vision/Dockerfile" = "zul/_project/computer_vision/Dockerfile"
"framework/project/computer_vision/docker-compose.yml" = "zul/_project/computer_vision/docker-compose.yml"
"framework/project/computer_vision/docker-compose.cpu.yml" = "zul/_project/computer_vision/docker-compose.cpu.yml"
"framework/project/computer_vision/configs" = "zul/_project/computer_vision/configs"
"framework/project/computer_vision/src" = "zul/_project/computer_vision/src"
"framework/project/computer_vision/tests" = "zul/_project/computer_vision/tests"

[dependency-groups]
dev = [
    "zul[all]",
    "black>=23.0.0",
    "ipykernel>=7.1.0",
    "langchain>=1.0.5",
    "langchain-ollama>=1.0.0",
    "mypy>=1.0.0",
    "ollama>=0.6.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    { include-group = "docs" },
    "ruff>=0.1.0",
    "streamlit>=1.51.0",
    "nltk>=3.9.2",
    "torch",
    "torchvision",
]
# Dependency pemeriksaan kode. Workflow .github/workflows/ci.yml meng-install
# grup ini dengan versi persis dari uv.lock. Extra ocr dan detection sengaja
# tidak ikut, karena membawa torch CUDA berukuran beberapa GB. Test yang butuh
# docling atau rfdetr dilewati di CI, dan dijalankan di komputermu.
ci = [
    "zul[milvus,redis,converter,analysis,pdf,llm,gemini,vision,tracking,mcp,evaluation]",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain>=1.0.5",
    "langchain-ollama>=1.0.0",
]
# Dependency situs dokumentasi. Workflow .github/workflows/docs.yml
# hanya meng-install grup ini, dengan versi persis dari uv.lock.
# Material tidak berjalan di MkDocs 2, jadi MkDocs tetap di 1.x.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "markdown-callouts>=0.4",
]

[tool.pytest.ini_options]
# `uv run pytest` hanya menguji framework. Kategori lain punya perintahnya
# sendiri, lihat README.md di folder masing-masing:
#   uv run pytest framework/agentic        skill pool
#   uv run pytest docs/tools/tests            tool dokumentasi
#   uv run pytest research/latihan         latihan (sebagian gagal, disengaja)
testpaths = ["framework/tests"]
addopts = "-ra"

# Gaya kode framework dan tool repo:
#   uv run black framework docs/tools
#   uv run ruff check framework docs/tools
#   uv run python framework/scripts/comment_style.py
# Skill pool, notebook, dan studi punya gaya sendiri; research/ berisi
# latihan. Keempatnya tidak ikut diperiksa.
[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "/(research|framework/agentic|framework/notebooks|framework/studies)/"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "research",
    "framework/agentic",
    "framework/notebooks",
    "framework/studies",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# B008:  Typer dan FastAPI memang memanggil fungsi di nilai default parameter.
# UP042: mengganti (str, Enum) dengan StrEnum mengubah hasil str() dari enum.
ignore = ["B008", "UP042"]

# Isi prompt adalah teks untuk model; memotong barisnya mengubah prompt-nya.
[tool.ruff.lint.per-file-ignores]
"framework/src/zul/utilities/Prompts/*.py" = ["E501"]

# "src" adalah package proyek hasil `zul build hexa`, jadi di dalam template
# impor `src.*` dikelompokkan sebagai kode sendiri, terpisah dari library.
[tool.ruff.lint.isort]
known-first-party = ["zul", "tests", "src"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
